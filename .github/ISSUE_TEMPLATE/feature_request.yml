name: Feature request
description: An idea to make NotchTouch more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like NotchTouch to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: Tell us about the situation where you'd use it.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Sketches, screenshots or apps that do something similar.
